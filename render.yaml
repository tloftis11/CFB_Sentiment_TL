services:
  # Web application (rankings page + chat)
  - type: web
    name: cfb-sentiment
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CFBD_API_KEY
        sync: false          # Set manually in Render dashboard
      - key: ANTHROPIC_API_KEY
        sync: false          # Set manually in Render dashboard
      - key: CFB_SEASON_YEAR
        value: "2026"
      - key: TRENDS_POWER_ONLY
        value: "true"
      - key: LOG_LEVEL
        value: "INFO"
      - key: PIPELINE_RUN_TIME
        value: "06:00"
    disk:
      name: cfb-data
      mountPath: /data
      sizeGB: 1              # Persistent disk for SQLite ($1/mo)

  # Daily pipeline cron job
  - type: cron
    name: cfb-sentiment-pipeline
    runtime: python
    schedule: "0 6 * * *"   # 6 AM UTC daily
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: CFBD_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CFB_SEASON_YEAR
        value: "2026"
      - key: TRENDS_POWER_ONLY
        value: "true"
