services:
  # Web application (rankings page + chat + background pipeline)
  - type: web
    name: cfb-sentiment
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CFBD_API_KEY
        sync: false          # Set manually in Render dashboard
      - key: ANTHROPIC_API_KEY
        sync: false          # Set manually in Render dashboard
      - key: CFB_SEASON_YEAR
        value: "2026"
      - key: TRENDS_POWER_ONLY
        value: "true"
      - key: LOG_LEVEL
        value: "INFO"
      - key: PIPELINE_RUN_HOUR
        value: "6"
      - key: DATA_DIR
        value: "/data"       # Persistent disk mount path
    disk:
      name: cfb-data
      mountPath: /data
      sizeGB: 1              # Persistent disk for SQLite ($1/mo)
